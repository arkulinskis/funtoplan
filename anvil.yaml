      name: completed_at
      type: datetime
    - admin_ui: {order: 28, width: 200}
      name: approved_by
      target: members
      type: link_single
    server: full
    title: Items
  messages:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: family
      target: families
      type: link_single
    - admin_ui: {order: 1, width: 200}
      name: author
      target: members
      type: link_single
