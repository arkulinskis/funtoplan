      name: active
      type: bool
    - admin_ui: {order: 8, width: 200}
      name: joined
      type: datetime
    server: full
    title: Members
  items:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: family
      target: families
      type: link_single
