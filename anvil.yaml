    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "WebApplication", "@id": "https://funtoplan.com/#app", "name": "Fun To Plan", "url": "https://funtoplan.com/", "description": "A shared family board for 2 to 4 people: chores, events and wish lists, family chat, recurring tasks that take turns, and brownie points for getting things done.", "image": "https://funtoplan.com/_/theme/og-image.png", "inLanguage": "en", "publisher": {"@id": "https://arkvital.com/#org"}, "keywords": "family chore app, family task board, chore chart app, family organizer, chores with points, shared family to-do list, household tasks app, kids chores rewards, family kanban", "applicationCategory": "LifestyleApplication", "operatingSystem": "Any (web browser)", "browserRequirements": "Requires JavaScript and a modern web browser", "featureList": ["Three card types: tasks, events and wants", "Brownie point bounties and optional approval for finished tasks", "Recurring tasks with Take turns to rotate them through the family", "Family chat and an activity feed", "Join with a QR code; works on phones and desktop", "Levels, a weekly family goal and a 7-day podium"], "audience": {"@type": "Audience", "audienceType": "Families and households of 2 to 4 people"}}, {"@type": "WebSite", "@id": "https://funtoplan.com/#site", "url": "https://funtoplan.com/", "name": "Fun To Plan", "publisher": {"@id": "https://arkvital.com/#org"}}, {"@type": "Organization", "@id": "https://arkvital.com/#org", "name": "Arkvital", "url": "https://arkvital.com", "email": "arkvital@outlook.com", "address": {"@type": "PostalAddress", "addressLocality": "Montreal", "addressRegion": "QC", "addressCountry": "CA"}}]}</script>
