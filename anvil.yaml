      name: created
      type: datetime
    - admin_ui: {order: 9, width: 200}
      name: updated
      type: datetime
    - admin_ui: {order: 10, width: 200}
      name: due_date
      type: date
    - admin_ui: {order: 11, width: 200}
      name: event_at
      type: datetime
    - admin_ui: {order: 12, width: 200}
      name: location
      type: string
    - admin_ui: {order: 13, width: 200}
      name: link
      type: string
    - admin_ui: {order: 14, width: 200}
      name: priority
      type: string
    - admin_ui: {order: 15, width: 200}
      name: points
