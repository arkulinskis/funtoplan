metadata:
  description: 'A shared family board for 2 to 4 people: chores, events and wish lists, family chat, recurring tasks that
    take turns, and brownie points for getting things done.'
  logo_img: asset:logo.png
  title: 'Fun To Plan: a family chore board with brownie points'
name: Fun To Plan
