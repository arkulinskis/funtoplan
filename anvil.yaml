    <style>html, body { background: #f1ede4; margin: 0; } html.ui-dark, html.ui-dark body { background: #1e2126; }</style>
package_name: Fun_To_Plan
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    use_email: true
    use_google: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup:
  module: startup
  type: module
