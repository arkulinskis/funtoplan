    - admin_ui: {order: 4, width: 200}
      name: next_seq
      type: number
    - admin_ui: {order: 5, width: 200}
      name: weekly_goal
      type: number
    server: full
    title: Families
  members:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: family
      target: families
