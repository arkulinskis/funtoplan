      name: occurrence
      type: number
    - admin_ui: {order: 21, width: 200}
      name: acks
      type: simpleObject
    - admin_ui: {order: 22, width: 200}
      name: comment_count
      type: number
    - admin_ui: {order: 23, width: 200}
      name: points_awarded
      type: number
    - admin_ui: {order: 24, width: 200}
      name: points_to
      target: members
      type: link_single
    - admin_ui: {order: 25, width: 200}
      name: spawned_next
      type: bool
