metadata: {description: 'A shared family board: tasks, events, wants, chat and brownie points.', logo_img: 'asset:logo.png', title: Fun To Plan}
name: Fun To Plan
native_deps:
  head_html: |
    <script src="_/theme/legal-kit.js?v=bb5824ed0b"></script>
    <meta name="theme-color" content="#dce9f5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="_/theme/favicon.svg?v=4" data-ftp>
    <link rel="apple-touch-icon" href="_/theme/apple-touch-icon.png?v=4" data-ftp>
    <link rel="stylesheet" href="_/theme/ftp.css?v=4">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="_/theme/ftp.js?v=4"></script>
    <style>html, body { background: #dce9f5; margin: 0; }</style>
package_name: Fun_To_Plan
runtime_options:
  client_version: '3'
  server_spec: {base: python314}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_signup: true, confirm_email: false, enable_automatically: true, use_email: true}
  server_config: {user_table: users}
  source: /runtime/services/anvil/users.yml
startup: {module: Form1, type: form}
