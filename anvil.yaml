      target: items
      type: link_single
    - admin_ui: {order: 5, width: 200}
      name: created
      type: datetime
    server: full
    title: Points Log
  users:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      client_hidden: false
      name: email
      type: string
    - admin_ui: {order: 1, width: 200}
      client_hidden: true
      name: enabled
      type: bool
    - admin_ui: {order: 2, width: 200}
      client_hidden: true
      name: last_login
      type: datetime
    - admin_ui: {order: 3, width: 200}
      client_hidden: true
      name: password_hash
      type: string
    - admin_ui: {order: 4, width: 200}
      client_hidden: true
      name: n_password_failures
      type: number
    - admin_ui: {order: 5, width: 200}
      client_hidden: true
      name: confirmed_email
      type: bool
    - admin_ui: {order: 6, width: 200}
      client_hidden: true
      name: signed_up
      type: datetime
    - admin_ui: {order: 7, width: 200}
      client_hidden: false
      name: legal_version
      type: string
    - admin_ui: {order: 8, width: 200}
      client_hidden: false
      name: legal_accepted_at
      type: datetime
    - admin_ui: {order: 9, width: 200}
      client_hidden: false
      name: legal_source
      type: string
    indexes: []
    server: full
    title: Users
