<div class="card-host">
  <div class="card" anvil:name="card">
    <button type="button" class="card-open" anvil:name="open" anvil:on-dom:click="self.open_click"></button>
    <div class="card-row card-top" style="margin:0">
      <span class="avatar sm" anvil:dom-node="who"></span>
      <div class="sp" style="min-width:0"><div class="card-title" anvil:dom-node="title"></div><div class="small muted b" anvil:dom-node="sub"></div></div>
      <span class="pill bp" anvil:name="pts"><svg class="brownie" viewBox="0 0 24 24" aria-hidden="true"><rect class="b-cake" x="3" y="6" width="18" height="14" rx="3.5"/><path class="b-top" d="M3 9.5A3.5 3.5 0 0 1 6.5 6h11A3.5 3.5 0 0 1 21 9.5v2q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0z"/><circle class="b-dot" cx="8" cy="15.5" r="1"/><circle class="b-dot" cx="13.5" cy="17" r="1"/><circle class="b-dot" cx="16.5" cy="14.2" r=".9"/></svg><span anvil:dom-node="pts_text"></span></span>
      <span class="status s-done" anvil:name="status"><i></i><span anvil:dom-node="status_text"></span></span>
    </div>
  </div>
</div>
