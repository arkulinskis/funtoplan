    <div class="share-bar" anvil:dom-node="b_chk"><span class="k">Checked</span><span class="n" anvil:dom-node="n_chk"></span><span class="track"><i class="sw-chk" anvil:dom-node="f_chk"></i></span></div>
  </div>
</div>
