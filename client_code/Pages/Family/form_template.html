<anvil-form layout="Fun_To_Plan.Layouts.Shell">
  <anvil-block slot="content">
    <div class="page-head"><div class="sp"><anvil-component type="Label" name="title" prop:role='["page-title"]'></anvil-component><div class="page-sub">Your family board</div></div>
      <anvil-component type="Button" name="settings_button" prop:text="Family settings" prop:role='["icon-btn", "ic-gear"]'></anvil-component></div>

    <div class="grid-2">
      <div>
        <div class="neu invite">
          <button type="button" class="qr-frame" anvil:dom-node="qr" aria-label="Show the big QR code"></button>
          <div class="col" style="gap:14px">
            <div><h2 class="section-title">Invite the family</h2><div class="small muted b" anvil:dom-node="spots"></div></div>
            <div class="code-tiles" role="img" anvil:dom-node="tiles"><span anvil:dom-node="t0"></span><span anvil:dom-node="t1"></span><span anvil:dom-node="t2"></span><span anvil:dom-node="t3"></span><span anvil:dom-node="t4"></span><span anvil:dom-node="t5"></span></div>
            <div class="seats"><span class="avatar sm" anvil:dom-node="s0"></span><span class="avatar sm" anvil:dom-node="s1"></span><span class="avatar sm" anvil:dom-node="s2"></span><span class="avatar sm" anvil:dom-node="s3"></span></div>
            <div class="row wrap">
              <anvil-component type="Button" name="copy_button" prop:text="Copy link" prop:role='["btn", "btn-sm", "ic-copy"]'></anvil-component>
              <anvil-component type="Button" name="share_button" prop:text="Share" prop:role='["btn", "btn-sm", "ic-share"]'></anvil-component>
              <anvil-component type="Button" name="big_qr_button" prop:text="Big QR" prop:role='["btn", "btn-sm", "btn-dark", "ic-qr"]'></anvil-component>
            </div>
          </div>
        </div>

        <section class="section">
          <div class="section-head"><h2 class="section-title">Brownie leaderboard</h2><span class="sp"></span>
            <div class="seg dark" style="width:190px" role="group" aria-label="Leaderboard period">
              <button type="button" data-lb="week" anvil:name="lb_week" anvil:on-dom:click="self.lb_click">7 days</button>
              <button type="button" data-lb="all" anvil:name="lb_all" anvil:on-dom:click="self.lb_click">All time</button>
            </div></div>
          <div class="neu podium">
            <div class="pod p2" anvil:name="pod1"><span class="avatar lg" anvil:dom-node="pa1"></span><div class="nm" anvil:dom-node="pn1"></div><div class="pillar"><span class="place">🥈</span><span class="pts"><svg class="brownie" viewBox="0 0 24 24" aria-hidden="true"><rect class="b-cake" x="3" y="6" width="18" height="14" rx="3.5"/><path class="b-top" d="M3 9.5A3.5 3.5 0 0 1 6.5 6h11A3.5 3.5 0 0 1 21 9.5v2q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0z"/></svg><span anvil:dom-node="pp1"></span></span></div></div>
            <div class="pod p1" anvil:name="pod0"><span class="avatar lg" anvil:dom-node="pa0"></span><div class="nm" anvil:dom-node="pn0"></div><div class="pillar"><span class="place">🥇</span><span class="pts"><svg class="brownie" viewBox="0 0 24 24" aria-hidden="true"><rect class="b-cake" x="3" y="6" width="18" height="14" rx="3.5"/><path class="b-top" d="M3 9.5A3.5 3.5 0 0 1 6.5 6h11A3.5 3.5 0 0 1 21 9.5v2q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0z"/></svg><span anvil:dom-node="pp0"></span></span></div></div>
            <div class="pod p3" anvil:name="pod2"><span class="avatar lg" anvil:dom-node="pa2"></span><div class="nm" anvil:dom-node="pn2"></div><div class="pillar"><span class="place">🥉</span><span class="pts"><svg class="brownie" viewBox="0 0 24 24" aria-hidden="true"><rect class="b-cake" x="3" y="6" width="18" height="14" rx="3.5"/><path class="b-top" d="M3 9.5A3.5 3.5 0 0 1 6.5 6h11A3.5 3.5 0 0 1 21 9.5v2q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0z"/></svg><span anvil:dom-node="pp2"></span></span></div></div>
          </div>
        </section>
      </div>
      <div>
        <section class="section" style="margin-top:0">
          <div class="section-head"><h2 class="section-title">Members</h2><span class="count" anvil:dom-node="member_count"></span></div>
          <div class="neu"><anvil-component type="RepeatingPanel" name="member_panel" prop:item_template="Fun_To_Plan.Items.MemberRow" prop:role='["members"]'></anvil-component></div>
        </section>

        <section class="section">
          <div class="section-head"><h2 class="section-title">Settings</h2></div>
          <div class="neu">
            <button type="button" class="setting" anvil:on-dom:click="self.profile_click"><span class="ic-wrap"><i class="ic ic-user"></i></span><div class="sp"><div class="t">Edit my profile</div><div class="s" anvil:dom-node="profile_sub"></div></div></button>
            <button type="button" class="setting" anvil:name="family_row" anvil:on-dom:click="self.settings_click"><span class="ic-wrap"><i class="ic ic-gear"></i></span><div class="sp"><div class="t">Family settings</div><div class="s">Name and weekly brownie goal</div></div></button>
            <div class="setting"><span class="ic-wrap"><i class="ic ic-moon"></i></span><div class="sp"><div class="t" id="night-t">Night mode</div><div class="s">The fridge after dark</div></div>
              <button type="button" class="toggle" role="switch" aria-labelledby="night-t" anvil:name="night_toggle" anvil:on-dom:click="self.night_click"></button></div>
            <button type="button" class="setting" anvil:name="code_row" anvil:on-dom:click="self.code_click"><span class="ic-wrap"><i class="ic ic-refresh"></i></span><div class="sp"><div class="t">New join code</div><div class="s">Old QR codes and links stop working</div></div></button>
            <button type="button" class="setting" data-lk-open="overview"><span class="ic-wrap"><i class="ic ic-shield"></i></span><div class="sp"><div class="t">Privacy &amp; Terms</div><div class="s">Your data, your rights, the rules</div></div></button>
            <button type="button" class="setting danger" anvil:on-dom:click="self.leave_click"><span class="ic-wrap"><i class="ic ic-logout"></i></span><div class="sp"><div class="t">Leave family</div><div class="s">Your cards stay on the board</div></div></button>
            <button type="button" class="setting" anvil:on-dom:click="self.logout_click"><span class="ic-wrap"><i class="ic ic-logout"></i></span><div class="sp"><div class="t">Log out</div><div class="s" anvil:dom-node="email"></div></div></button>
          </div>
        </section>
      </div>
    </div>
    <p class="center small muted b" style="margin-top:26px" anvil:dom-node="foot"></p>
  </anvil-block>
</anvil-form>
