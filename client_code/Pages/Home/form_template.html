<anvil-form layout="Fun_To_Plan.Layouts.Shell">
  <anvil-block slot="content">
    <div class="page-head"><div class="sp"><h1 class="page-title">Today</h1><div class="page-sub" anvil:dom-node="fam_name"></div></div>
      <anvil-component type="Button" name="theme_button" prop:text="Toggle night mode" prop:role='["icon-btn", "ic-moon"]'></anvil-component></div>

    <div class="grid-2">
      <div>
        <div class="neu hero">
          <div class="ring"><svg viewBox="0 0 88 88" aria-hidden="true"><defs><linearGradient id="ftp-ring-grad" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2fa36b"/><stop offset=".35" stop-color="#f2b51d"/><stop offset=".7" stop-color="#f07c2a"/><stop offset="1" stop-color="#e5484d"/></linearGradient></defs><circle class="track" cx="44" cy="44" r="38"/><circle class="fill" cx="44" cy="44" r="38" stroke-dasharray="238.8" stroke-dashoffset="238.8" anvil:dom-node="ring_fill"/></svg>
            <div class="ring-inner"><span class="lvl">LEVEL</span><span class="num" anvil:dom-node="level_num"></span></div></div>
          <div style="min-width:0"><div class="hero-hello" anvil:dom-node="hello"></div><div class="hero-name" anvil:dom-node="me_name"></div>
            <div class="hero-stats"><span class="pill pill-black"><i class="ic ic-trophy"></i><span anvil:dom-node="level_title"></span></span>
              <span class="pill bp"><svg class="brownie" viewBox="0 0 24 24" aria-hidden="true"><rect class="b-cake" x="3" y="6" width="18" height="14" rx="3.5"/><path class="b-top" d="M3 9.5A3.5 3.5 0 0 1 6.5 6h11A3.5 3.5 0 0 1 21 9.5v2q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0z"/><circle class="b-dot" cx="8" cy="15.5" r="1"/><circle class="b-dot" cx="13.5" cy="17" r="1"/><circle class="b-dot" cx="16.5" cy="14.2" r=".9"/></svg><span anvil:dom-node="me_points"></span></span>
              <span class="pill pill-in" anvil:dom-node="week"></span></div>
            <div class="hero-next" anvil:dom-node="next"></div></div>
        </div>
      </div>
      <div>
        <div class="neu goal" style="margin-top:0">
          <div class="row"><h2 class="section-title" style="font-size:24px">Family goal</h2><span class="small muted b">last 7 days</span><span class="sp"></span>
            <span class="pill bp"><svg class="brownie" viewBox="0 0 24 24" aria-hidden="true"><rect class="b-cake" x="3" y="6" width="18" height="14" rx="3.5"/><path class="b-top" d="M3 9.5A3.5 3.5 0 0 1 6.5 6h11A3.5 3.5 0 0 1 21 9.5v2q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0q-1.5 1.5-3 0z"/></svg><span anvil:dom-node="week_total"></span></span></div>
          <div class="bar" role="progressbar" aria-label="Family goal" aria-valuemin="0" aria-valuemax="100" anvil:dom-node="goal_bar_box"><i anvil:dom-node="goal_bar"></i></div>
          <div class="row" style="margin-top:12px"><anvil-component type="RepeatingPanel" name="family_stack" prop:item_template="Fun_To_Plan.Items.Avatar" prop:role='["stack"]'></anvil-component>
            <span class="small b muted" anvil:dom-node="goal_text"></span></div>
        </div>
      </div>
    </div>

    <section class="section">
      <div class="section-head"><h2 class="section-title">Needs you</h2><span class="count" anvil:dom-node="needs_count"></span></div>
      <anvil-component type="RepeatingPanel" name="needs_panel" prop:item_template="Fun_To_Plan.Items.Card" prop:role='["list"]'></anvil-component>
      <div class="empty" anvil:name="needs_empty"><span class="big">🌤️</span>All clear! Nothing waiting on you.</div>
    </section>

    <div class="grid-2">
      <section class="section">
        <div class="section-head"><h2 class="section-title">Open bounties</h2><span class="count" anvil:dom-node="bounty_count"></span><span class="sp"></span>
          <a class="btn btn-sm btn-ghost" href="#board/bounty">See all</a></div>
        <anvil-component type="RepeatingPanel" name="bounty_panel" prop:item_template="Fun_To_Plan.Items.Card" prop:role='["list"]'></anvil-component>
        <div class="empty" anvil:name="bounty_empty"><span class="big">🍫</span>No open bounties. Add a task with brownie points!</div>
      </section>
      <section class="section">
        <div class="section-head"><h2 class="section-title">Coming up</h2><span class="count" anvil:dom-node="event_count"></span></div>
        <anvil-component type="RepeatingPanel" name="event_panel" prop:item_template="Fun_To_Plan.Items.Card" prop:role='["list"]'></anvil-component>
        <div class="empty" anvil:name="event_empty"><span class="big">📅</span>No events in the next two weeks.</div>
      </section>
    </div>

    <section class="section" anvil:name="recent_part">
      <div class="section-head"><h2 class="section-title">Recently done</h2></div>
      <anvil-component type="RepeatingPanel" name="recent_panel" prop:item_template="Fun_To_Plan.Items.DoneRow" prop:role='["list"]'></anvil-component>
    </section>
  </anvil-block>
</anvil-form>
