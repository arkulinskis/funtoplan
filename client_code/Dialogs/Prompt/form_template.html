<div class="ftp-dlg">
  <div class="sheet-grip"></div>
  <div class="sheet-head"><h2 class="sheet-title" anvil:dom-node="title"></h2><span class="sp"></span>
    <anvil-component type="Button" name="close_button" prop:text="Close" prop:role='["icon-btn", "ic-close"]'></anvil-component></div>
  <div class="sheet-body">
    <anvil-component type="TextArea" name="text_box" prop:role='["textarea"]'></anvil-component>
  </div>
  <div class="sheet-foot">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "sp"]'></anvil-component>
    <anvil-component type="Button" name="ok_button" prop:text="OK" prop:role='["btn", "btn-dark", "sp"]'></anvil-component>
  </div>
</div>
